const items=[{"title": "Curiosidades y novedades en veterinaria", "url": "https://qvet.net/curiosidades-y-novedades-en-veterinaria/", "file": "paginas/2a/2a9ccc5bb-index.html", "kind": "negocio", "description": "En el blog de QVET encontrarás información útil y contenido de valor sobre el sector veterinario y tecnología", "text": "La Universidad Complutense de Madrid confía cada año en QVET para la formación de sus futuros veterinarios Un año más, los alumnos de 5º curso del Grado en Veterinaria de la Universidad Complutense de Madrid contarán en su formación con QVET y Leer más » febrero 19, 2026 No hay comentarios"}, {"title": "Día Mundial del Gato: mejores cuidados y aumento de la longevidad - El software líder", "url": "https://qvet.net/dia-mundial-del-gato-un-analisis-del-panorama-felino-en-espana/", "file": "paginas/e7/e76d5be07-index.html", "kind": "articulo", "description": "Los gatos suponen un 24% del total de pacientes de los centros veterinarios, según detalla el Resumen Anual de 2022 de VMS.", "text": "Ir al contenido Día Mundial del Gato: mejores cuidados y aumento de la longevidad agosto 8, 2023 Los gatos suponen un 24% del total de pacientes de los centros veterinarios, según detalla el Resumen Anual de 2022 de VMS. De acuerdo con el resumen anual de Veterinary Management Studies en España, los gatos representaron un 24% de los pacientes tratados en centros veterinarios en todo el país . Este dato, junto con otros destacados, nos brinda una visión integral de la población felina y su cuidado en nuestras clínicas. Un panorama que en QVET detallamos con motivo del Día Mundial del Gato. Durante el año pasado, los gatos representaron aproximadamente el 24% de los pacientes atendidos en centros veterinarios en España. La frecuencia de visita fue de una vez al año para el 45% de los dueños , de 2 a 4 visitas para el 37% y de más de 4 visitas para el 16%. Además, estas visitas dejaron de media 179€ en las clínicas veterinarias. Un 52% de los dueños de gatos gastaron al año menos de 100€, un 22% entre 100 y 202€ y un 9% entre 201 y 301€. En este sentido, destaca el gasto mayor de 300€ por el 15% de los dueños de felinos durante el año pasado. Esta inversión financiera subraya el compromiso de los propietarios para brindar una atención óptima y avanzada a sus compañeros felinos. Los gatos de 17 años aumentan casi un 4% Según este mismo resumen, cabe detallar el incremento del 3,9% en la presencia de gatos de 17 años de edad en comparación con 2018. Los gatos que más aumentaron su longevidad por edad fueron de 2 años (17%), 1 año (15%) y 3 años (12%). Un aumento sin duda indicativo del progreso en medicina veterinaria y la implementación de estrategias de cuidado efectivas para mejorar la longevidad y calidad de vida de estos animales. Exodoncia y hospitalización, los servicios más demandados en 2022 De entre los servicios más demandados por los dueños de felinos en centros veterinarios destacan la exodoncia; que aumentó un 9% con respecto al año anterior , y el servicio de hospitalización; que aumentó un 8%. Los gatos esfinge han aumentado cada vez más su presencia en los hogares Otros servicios que aumentaron su demanda fueron; %), la laparotomía (8%) la castración (6%), las visitas a domicilio (6%) y la eutanasia (5,3%). Servicios por los cuales el crecimiento de la media del PVP por clínica aumentó un 9%, de 32€ 2n 2021 a 35€ en 2022. Los gatos esfinge se vuelven más comunes en España Por otro lado, resalta el fuerte crecimiento de los gatos esfinge, característicos por su ausencia de pelo, en España : su presencia en las casas aumentó nada menos que un 165% en 2020. Tras ellos, los british shorthair fueron los segundos más demandados, creciendo hasta un 99%. Finalmente, los europeos también ampliaron su presencia en un 34%. Estas, junto con la denominado “común europea”, fueron las razas que más visitaron al veterinario, 95 y 87 veces de media respectivamente. Tras ellos, los “mestizo felina”, persa y siamés, con 27, 12 y 10 veces de media. La ra"}, {"title": "Distribuidores - El software líder", "url": "https://qvet.net/distribuidores/", "file": "paginas/3d/3d91c23da-index.html", "kind": "negocio", "description": "Integración directa con tus distribuidores habituales, gracias a QVET ¡Atención, Veterinari@! ¿Te gustaría tener un control exacto de tus pedidos, lotes y stock sin complicaciones? Con QVET es posible. Fácil, rápido y todo bajo control Nuestros clientes ya pueden aprovecharse de todas las ventajas, saber exactamente qué tienen, qué entra, qué sale, y cuándo. ¿Y lo mejor? […]", "text": "Integración directa con tus distribuidores habituales, gracias a QVET ¡Atención, Veterinari@! ¿Te gustaría tener un control exacto de tus pedidos , lotes y stock sin complicaciones? Con QVET es posible . Fácil, rápido y todo bajo control Nuestros clientes ya pueden aprovecharse de todas las ventajas, saber exactamente qué tienen, qué entra, qué sale, y cuándo. ¿Y lo mejor? Ya tenemos integración directa con tus distribuidores habituales ¿Cómo funciona? Haces el pedido como siempre, y cuando lo realizas ¡Recibes en QVET tu albarán! Olvídate de apuntar a mano o de errores. QVET lo hace por ti: entradas automáticas, control por lotes, trazabilidad y mucho más. Control, tranquilidad y más tiempo para lo importante con el software integrado con los principales distribuidores del sector. Todo con QVET ¡Pruébalo ahora y siente la diferencia! Déjanos tus datos Nombre Correo electrónico Telefono País España Argentina Bolivia Brasil Chile China Colombia Costa Rica Ecuador El Salvador Estados Unidos Guatemala Honduras México Panamá Perú Portugal República Dominicana Uruguay Venezuela Mensaje ¡Enviar formulario! Instagram Facebook Youtube Linkedin Twitter El Software Líder De Gestión Veterinaria Copyright © QVET 2023 Consentimiento de Cookies Para brindar las mejores experiencias, utilizamos tecnologías como cookies para almacenar y/o acceder a la información del dispositivo. El consentimiento pa ado los diferentes procesos por los que el hospital pasó. Primero, antes de contar con QVET, el personal de Restelo trabajaba con un programa de hospitalización diferente del programa que se usaba para la “facturación y gestión de clientes”, observa. “Teníamos el doble de trabajo, porque cada vez que se internaba un animal debíamos introducir sus datos como si fuese la primera vez”, añade Cid. “ Los veterinarios y auxiliares perdían más de la mitad del tiempo en copiar el historial de los pacientes ”, revela sobre el día a día en el centro antes de contar con el programa. Migración a QVET y éxito en el módulo de hospitalización Más tarde, tras migrar al programa de QVET, Cid y su equipo se percataron de las principales ventajas que constituía contar un software integral para la gestión de un hospital con sus características, con una media de 30 animales internados al día. El centro cuenta con un laboratorio propio y una máquina TAC para animales La integración del módulo de hospitalización de QVET, ha sido el principal cambio del que se ha beneficiado todo el centro ; “hoy en día el animal ya está metido en el sistema”, recalca Cid, “solo rellenamos los datos básicos del ingreso del animal y su peso, y rápidamente tenemos un animal hospitalizado, con lo que podemos introducir la medicación”, asevera. Además, al contar con un laboratorio propio, Restelo cuenta con la facilidad de conectar las máquinas de análisis que se usan internamente ; “antes teníamos que escribir a mano todos esos resultados y perdíamos una gran cantidad de tiempo”, narra la directora clínica. Por otro lado, en términos de recepción y gestión de citas, las integraciones de QVET de sala de espera y los mensajes internos , a través de los cuales se pueden dejar “recados para los médicos en el mismo programa”, constituyen una facilidad “excelente”, recalca Cid. Tanto Margarida como Inés Cid, la directora general de Restelo, coinciden en que el programa QVET es amigo de quién lo usa”. Así mismo, ambas destacan la e"}, {"title": "Entrevistas QVET | Consejo General de Colegios Veterinarios de España - El software líder", "url": "https://qvet.net/entrevistas-qvet-consejo-general-de-colegios-veterinarios-de-espana/", "file": "paginas/33/33a7ac475-index.html", "kind": "articulo", "description": "QVET se reúne en exclusiva con el Consejo General de Colegios Veterinarios de España para hablar sobre PRESCRIVET entre otros", "text": "Ir al contenido Entrevistas QVET | Consejo General de Colegios Veterinarios de España febrero 5, 2024 QVET se reúne en exclusiva con el Consejo General de Colegios Veterinarios de España. En concreto, con Luis Alberto Calvo Sáez , presidente del Consejo General de Colegios Veterinarios de España, y con José Ramón Caballero , consejero del mismo. Charlamos con ellos sobre la Plataforma de Prescripción Veterinaria PRESCRIVET, la nueva ley de bienestar animal y los próximos congresos organizados por la entidad, entre muchos otros. “Prescrivet es capaz de hacer un almacén personalizado para cada veterinario” El sistema Prescrivet se basa en la ley de firma electrónica del 2003 en su artículo 3º (ley 59/2003) que otorga valor legal a los documentos electrónicos firmados mediante medios correctos. “Con esta plataforma de receta electrónica lo que pretendemos es que el veterinario realice su trabajo que es en primer lugar visitar al animal que está enfermo, hacer el diagnóstico, el pronóstico y a partir de ahí recetar la prescripción del medicamento que corresponda”, declara Luis Calvo. Una plataforma que, ante todo, “impide hacer cualquier otra cosa que no sea lo que la legislación aplica” , agrega. El fin de esta plataforma es facilitar el trabajo del veterinario, que “por el control de los microbianos” debe informar al Ministerio a través de Presvet, destaca Calvo Sáez. Además, e l portal digital se encuentra conectado al vademécum correspondiente , “para que los medicamentos sean los adecuados, incluso incluyendo su dosificación”, apostilla el presidente del Consejo General. “Con un código de barras el propietario del animal dispone de la receta electrónica” La plataforma, que ha sido mejorada en una nueva versión para hacer recetas electrónicas “empieza a funcionar en febrero”, informa Luis Alberto Calvo. En este sentido, desde COLVET añaden la posibilidad de integrar su plataforma con programas de gestión veterinarios como QVET . Estas recetas, ofrecen a los propietarios un QR o código de barras, con el que los tutores disponen de la receta “igual que con la humana”, compara Calvo. En resumen, una herramienta que ahora incluye la capacidad de “detectar los errores humanos como incluir un código de explotación erróneo” , ejemplifica el presidente. Una solución que facilita el trabajo no solo para las clínicas y hospitales veterinarios sino para el “veterinario de explotación”, detalla el presidente. Luis Alberto Calvo Sáez, presidente del Consejo General de Colegios Veterinarios de España “El veterinario de explotación es una de las preocupaciones del Colegio de Veterinarios” Con respecto al veterinario de explotación, tanto Calvo como Caballero subrayan la importancia de su figura , “porque es el responsable de la producción animal, la ganadería, una de las fuentes más importantes de la alimentación humana, que es la que viene de la explotación animal”, explica José Ramón Caballero, quien defiende el compromiso de la veterinaria con la actividad p"}, {"title": "Escriba QVET - El software líder", "url": "https://qvet.net/escriba-qvet/", "file": "paginas/62/621363fc3-index.html", "kind": "negocio", "description": "Tu recepción cubierta las 24 horas gracias a la IA QVET https://youtu.be/u1Yx_Wyhu9Y ¿Qué pasa cuando un hospital veterinario recibe más llamadas y mensajes de los que su equipo puede atender? En QVET nos hemos ido hasta Hospital Veterinario Ciudad de los Ángeles para descubrirlo de primera mano. Un hospital con un volumen enorme de llamadas, mensajes […]", "text": "Tu recepción cubierta las 2
