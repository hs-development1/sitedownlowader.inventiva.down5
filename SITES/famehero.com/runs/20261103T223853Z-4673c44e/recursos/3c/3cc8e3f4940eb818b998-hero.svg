<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.05)"/>
    </linearGradient>
    <linearGradient id="accent-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="rgb(79, 82, 193)"/>
    </linearGradient>
    <linearGradient id="accent-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="rgb(79, 82, 193)"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.10)"/>
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.02)"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"/>

    <!-- Decorative orbs -->
    <circle cx="1040" cy="260" r="280" fill="url(#orb)"/>
    <circle cx="1040" cy="260" r="200" fill="rgba(99, 102, 241, 0.04)"/>
    <circle cx="1040" cy="260" r="120" fill="rgba(99, 102, 241, 0.03)"/>
    <circle cx="1040" cy="260" r="240" fill="none" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>

    <!-- Dot grid overlay -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(99, 102, 241, 0.06)"/>
    </pattern>
    <rect x="700" y="40" width="480" height="540" fill="url(#dots)"/>

    <!-- Watermark icon inside orb -->
    <g transform="translate(1000, 220) scale(3.5)" fill="none" stroke="rgba(99, 102, 241, 0.10)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" /><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14" /><path d="M8 6v8" />
    </g>

    <!-- Left accent bar -->
    <rect x="50" y="66" width="4" height="417.2" rx="2" fill="url(#accent-v)" opacity="0.3"/>

    <!-- Category icon — large -->
    <g transform="translate(100, 70) scale(2.8)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" /><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14" /><path d="M8 6v8" />
    </g>

    <!-- Title -->
    <text x="100" y="205.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1.5">
        <tspan x="100" dy="0">8 Best PR Agencies to</tspan>
        <tspan x="100" dy="64">Increase Online</tspan>
        <tspan x="100" dy="64">Visibility</tspan>
    </text>

    <!-- Year badge -->
    <rect x="100" y="429.2" rx="25" width="160" height="50" fill="#6366f1"/>
    <text x="180" y="462.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">2026</text>

    <!-- Bottom divider -->
    <line x1="50" y1="555" x2="1150" y2="555" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1"/>

    <!-- FameHero logo + text -->
    <image href="data:image/png;base64," x="50" y="570" height="40" preserveAspectRatio="xMinYMid meet"/>
    <text x="98" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="0.5">FameHero</text>
    <text x="1150" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="end" letter-spacing="0.3">famehero.com</text>

  </g>
</svg>